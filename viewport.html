<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const viewport = prompt("Coloca el tamaño de pantalla")
        if (viewport===576){
            alert("xs")
        } else if (viewport<768){
            alert("sm")
        } else if (viewport < 962) {
            alert("md")
        } else {
            alert("xl")
        }
    </script>
</body>
</html>
